        :root {

            --button-background: #3a86ff;
            --button-hover: #2563eb;
            --text-color: #f5f7fa;
            --accent-color: #415a77;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: var(--site-background);
            color: var(--text-color)
        }

        header {
            padding: 2rem 1rem;

        }

        }

            margin: 2rem auto
        }

        a {
            color: var(--text-color);
            font-weight: 700;
            text-decoration: none
        }

        .days {
            display: grid;
            gap: 1rem;
        }

        details {
            padding: 1rem 1.25rem;
            border-radius: .75rem;
            background: var(--card-background);
            color: var(--text-color);
            box-shadow: 0 10px 22px rgba(0, 0, 0, .32)
        }

        summary {
            cursor: pointer;
            font-weight: 700
        }

        .links {
            display: grid;
            gap: .6rem;
            padding-top: 1rem
        }

        .links a {
            display: block;
            padding: .75rem 1rem;
            border-radius: .5rem;
            background: var(--button-background);
            color: var(--text-color)
        }

        .links a:hover {
            background: var(--button-hover)
        }
    </style>
