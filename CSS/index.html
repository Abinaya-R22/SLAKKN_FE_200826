<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Tasks</title>
  <style>
    :root {
      --site-background: #0d1b2a;
      --card-background: #1b263b;
      --button-background: #3a86ff;
      --button-hover: #2563eb;
      --text-color: #f5f7fa;
      --accent-color: #415a77;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: var(--site-background);
      color: var(--text-color);
    }

    header {
      padding: 2rem 1rem;
      text-align: center;
      background: var(--site-background);
      border-bottom: 1px solid var(--accent-color);
    }

    h1 {
      margin: 0;
    }

    header p {
      color: var(--text-color);
    }

    main {
      width: min(100% - 2rem, 58rem);
      margin: 2rem auto;
    }

    a {
      color: var(--text-color);
      font-weight: 700;
      text-decoration: none;
    }

    .days {
      display: grid;
      gap: 1rem;
    }

    details {
      padding: 1rem 1.25rem;
      border-radius: .75rem;
      background: var(--card-background);
      color: var(--text-color);
      box-shadow: 0 10px 22px rgba(0, 0, 0, .32);
    }

    summary {
      cursor: pointer;
      font-weight: 700;
    }

    .links {
      display: grid;
      gap: .6rem;
      padding-top: 1rem;
    }

    .links a {
      padding: .75rem 1rem;
      border-radius: .5rem;
      background: var(--button-background);
      color: var(--text-color);
    }

    .links a:hover {
      background: var(--button-hover);
    }
  </style>
</head>

<body>
  <header>
    <h1>CSS Tasks</h1>
    <p>Select a day to open its task output.</p>
  </header>
  <main>
    <p><a href="../index.html">Back to Task Portal</a></p>
    <section class="days">
      <details open>
        <summary>Day 1</summary>
        <div class="links">
          <a href="Day1/Day1_CSS.pdf">PDF</a>
        </div>
      </details>
      <details>
        <summary>Day 2</summary>
        <div class="links">
          <a href="Day2/index.html">Task</a>
        </div>
      </details>
      <details>
        <summary>Day 3</summary>
        <div class="links">
        <a href="Day3/task.html">Task</a>
        </div>
      </details>
      <details>
        <summary>Day 4</summary>
        <div class="links">
        <a href="Day4/Task1.html">Task1</a>
        <a href="Day4/Task2.html">Task2</a>
        <a href="Day4/Task3.html">Task3</a>
        </div>
      </details>
      <details>
        <summary>Day 5</summary>
        <div class="links">
         <a href="Day5/task1.html">Task1</a>
         </div>
      </details>
      <details>
        <summary>Day 6</summary>
        <div class="links">
         <a href="Day6/task1.html">Task1</a>
         </div>
      </details>
      <details>
        <summary>Day 7</summary>
        <div class="links">
         <a href="Day7/task1.html">Task1</a>
        <a href="Day7/task2.html">Task2</a>
        </div>
      </details>
      <details>
        <summary>Day 8</summary>
        <div class="links">
         <a href="Day8/task1.html">Task1</a>
         </div>

      </details>
      <details>
        <summary>Day 9</summary>
        <div class="links">
         <a href="Day9/index.html">Task</a>
         </div>
      </details>
    </section>
  </main>
</body>

</html
