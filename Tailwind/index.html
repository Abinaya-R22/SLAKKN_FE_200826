<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tailwind Tasks</title>
    <style>
        :root {
            --site-background: #0d1b2a;
            --card-background: #1b263b;
            --button-background: #3a86ff;
            --button-hover: #2563eb;
            --text-color: #f5f7fa;
            --accent-color: #415a77;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: var(--site-background);
            color: var(--text-color)
        }

        header {
            padding: 2rem 1rem;
            text-align: center;
            background: transparent;
            border-bottom: 1px solid var(--accent-color)
        }

        h1 {
            margin: 0
        }

        header p {
            color: var(--text-color)
        }

        main {
            width: min(100% - 2rem, 58rem);
            margin: 2rem auto
        }

        a {
            color: var(--text-color);
            font-weight: 700;
            text-decoration: none
        }

        .days {
      display: grid;
      gap: 1rem;
    }


        details {
            margin-bottom: 1rem;
            padding: 1rem 1.25rem;
            border-radius: .75rem;
            background: var(--card-background);
            color: var(--text-color);
            box-shadow: 0 10px 22px rgba(0, 0, 0, .3)
        }

        summary {
            cursor: pointer;
            font-weight: 700
        }

        .links {
            display: grid;
            gap: .6rem;
            padding-top: 1rem;
        }

        .links a {
            display: block;
            padding: .75rem 1rem;
            border-radius: .5rem;
            background: var(--button-background);
            color: var(--text-color)
        }

        .links a:hover {
            background: var(--button-hover)
        }
    </style>
</head>

<body>
    <header>
        <h1>Tailwind Tasks</h1>
        <p>Select a day to open its task output.</p>
    </header>
    <main>
        <p><a href="../index.html">Back to Task Portal</a></p>
       <section class="days">
        <details open>
            <summary>Day 1</summary>
            <div class="links">
                <a href="Day1/index.html">Task</a>
            </div>
        </details>
        <details>
            <summary>Day 2</summary>
            <div class="links">
            <a href="Day2/Projectaimultiverse/index.html">Project</a>
            <a href="Day2/Projectantigravity/index.html">Project</a>
            </div>
        </details>
        </section>
    </main>
</body>

</html>
