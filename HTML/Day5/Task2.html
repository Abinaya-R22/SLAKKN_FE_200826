<!DOCTYPE html>
<html>
    <head>
        <title>
            Student Registration Form
        </title>
    </head>
    <body>
        <form>
    <h2>Student Registration</h2>
    <label>Name:</label>
    <input type="text">

      <br><br>

    <label>Email:</label>
    <input type="email">

     <br><br>

    <label>Password:</label>
    <input type="password">

    <br><br>

    <label>Age:</label>
    <input type="number">
    
    <br><br>

    <label>Date of Birth:</label>
    <input type="date">

     <br><br>

    <label>Gender:</label><br>
    <input type="radio" name="gender" value="Male">Male<br>
    <input type="radio" name="gender" value="Female">Female<br> 
    <input type="radio" name="gender" value="others">Others<br> 

<br>
    <label>Course:</label>

    <select>
        <option>Full Stack Development</option><br>
        <option>Java</option><br>
        <option>Python</option><br>
        <option>Testing</option><br>
        <option>Data Analyst</option><br>
    </select>

    <br><br>
    <label>Skills:</label><br>
    <input type="checkbox" name="skills" value="HTML">HTML<br>
    <input type="checkbox" name="skills" value="CSS">CSS<br>
    <input type="checkbox" name="skills" value="JavaScript">JavaScript<br>
    <input type="checkbox" name="skills" value="React">React<br>
    <input type="checkbox" name="skills" value="Node.Js">Node.Js<br>
<br>
    <label>Address:</label><br>
     <textarea id="address" name="address" rows="4" cols="40" placeholder="Enter your full address"></textarea><br>
<br>
   <button type="submit">Register</button><br><br>
   <button type="reset">Reset</button><br>
    </form>
    </body>
</html>
